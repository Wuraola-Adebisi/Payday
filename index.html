    <title>Payday | Make a plan for your money</title>
    <script>
      (function () {
        var pages = {
          "/": { title: "Payday | Make a plan for your money", description: "Plan your spending, income, bills, savings and shared costs in one clear view. Payday helps you understand what is coming up and make a plan for your money." },
          "/about": { title: "About Payday | Money planning for real life", description: "Learn how Payday helps you organise personal spending, income, bills, savings goals and shared household costs." },
          "/contact": { title: "Contact Payday | Questions and feedback", description: "Contact Payday with product questions, feedback or requests for help with your money plan." },
          "/terms": { title: "Terms of Service | Payday", description: "Read the terms that apply when using Payday's personal money planning tools." },
          "/privacy": { title: "Privacy Policy | Payday", description: "Learn how Payday handles information used in personal money plans and shared-expense records." },
          "/legal": { title: "Legal Information | Payday", description: "Important information about Payday's money planning tools and their intended use." },
          "/app": { title: "Your Money Plan | Payday", description: "Review your spending, income, bills, savings goals and shared costs in one place." }
        };
        function updateMetadata() {
          var path = window.location.pathname;
          while (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
          if (path.indexOf("/app/") === 0) path = "/app";
          var data = pages[path] || pages["/"];
          document.title = data.title;
          var description = document.querySelector('meta[name="description"]');
          if (description) description.setAttribute("content", data.description);
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute("href", "https://www.payday.money" + (path === "/" ? "/" : path));
          [["og:title", data.title], ["og:description", data.description], ["og:url", "https://www.payday.money" + (path === "/" ? "/" : path)], ["twitter:title", data.title], ["twitter:description", data.description]].forEach(function (entry) {
            var node = document.querySelector('meta[property="' + entry[0] + '"]') || document.querySelector('meta[name="' + entry[0] + '"]');
            if (node) node.setAttribute("content", entry[1]);
          });
        }
        updateMetadata();
        window.addEventListener("popstate", updateMetadata);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
