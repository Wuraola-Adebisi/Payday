    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Payday — Your money, with more clarity</title>
    <script>
      (function () {
        var pages = {
          "/": { title: "Payday — Your money, with more clarity", description: "Plan your income, track spending, prepare for bills and make room for what matters." },
          "/about": { title: "About Payday — Money planning for real life", description: "Learn why Payday is built to make personal money planning feel clearer, more flexible and less intimidating." },
          "/ai": { title: "AI at Payday — What’s Coming", description: "Explore planned AI-assisted Payday capabilities for understanding spending patterns, exploring budget options and planning with more context. Features are in development." },
          "/contact": { title: "Contact Payday — Questions and feedback", description: "Get in touch with Payday about product feedback, questions or help with the money planner." },
          "/terms": { title: "Terms of Service — Payday", description: "Read the terms for using Payday's personal money planning tools." },
          "/privacy": { title: "Privacy Policy — Payday", description: "Understand how Payday handles information you enter into its personal money planner." },
          "/legal": { title: "Legal Information — Payday", description: "Important information about Payday's money planning tools and their intended use." },
          "/app": { title: "Money Planner — Payday", description: "Organise your income, expenses, bills and savings goals in your Payday planner." }
        };
        function updateMetadata() {
          var path = window.location.pathname.replace(/\/+$/, "") || "/";
          if (path.indexOf("/app/") === 0) path = "/app";
          var data = pages[path] || pages["/"];
          document.title = data.title;
          var description = document.querySelector('meta[name="description"]');
          if (description) description.setAttribute("content", data.description);
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute("href", "https://www.payday.money" + (path === "/" ? "/" : path));
          [["og:title", data.title], ["og:description", data.description], ["og:url", "https://www.payday.money" + (path === "/" ? "/" : path)], ["twitter:title", data.title], ["twitter:description", data.description]].forEach(function (entry) {
            var node = document.querySelector('meta[property="' + entry[0] + '"]') || document.querySelector('meta[name="' + entry[0] + '"]');
            if (node) node.setAttribute("content", entry[1]);
          });
        }
        updateMetadata();
        window.addEventListener("popstate", updateMetadata);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
